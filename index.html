<head>
    <meta charset="UTF-8">

    <title>Negative ?</title>
    <style>
        body {
            background-color: #0b0f14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
            overflow: hidden;
            transition: 0.2s;
        }

        section {
            height: 100dvh;
            width: 100%;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        div {
            margin: 20px;
            border-radius: 20px;
            background: #1a2230;
        }

        #btn {
            height: 10%;
            display: flex;
            justify-content: center;
            color: white;
            align-items: center;
            background-color: #2563eb;
        }

        #imgView {
            aspect-ratio: 1/1;
            border: 4px dashed #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        canvas {
            max-height: 100%;
            max-width: 100%;
            width: auto;
            height: auto;
            z-index: 3;
            object-fit: contain ;
        }

        #imgView h1 {
            position: absolute;
            z-index: 1;
        }

        p {
            color: lightgrey;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
        }

        #btn:hover {
            background-color: #3b82f6;
        }


        .corner {
            position: fixed;
            
            z-index: -1;
            pointer-events: none;


        }

        .top-left {
            top: 0;
            left: 0;
        }

        .bottom-right {
            bottom: 0;
            right: 0;
            transform: rotate(180deg);
        }


        @media screen and (max-width: 767px) {
            #imgView {
                width: 90%;
                
            }
            
        }

        /* Desktop */
        @media screen and (min-width: 767px) {
            .corner{
                width: 400px;
                height: 300px;
            }
            #imgView{
                height: 60vh;
            }
        }
    </style>
</head>

<body>
    <section>
        <div id="imgView">
            <h1 id="child_imgView_h1">
                <p>click here to open an image <br> <br> shzd-k</p>
            </h1>
            <canvas id="canvas"></canvas>
        </div>
        <div class="button" id="btn">
            <h1>Download</h1>
        </div>
    </section>

<svg class="corner bottom-right" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="blueBottom" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#312E81" />
            <stop offset="45%" stop-color="#17133F" />

        </linearGradient>

    <path d="M0 0 H400 C300 150 150 100 0 300 Z" fill="url(#blueBottom)" />
</svg>


<svg class="corner top-left" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="blueTop" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#312E81" />
            <stop offset="45%" stop-color="#17133F" />
            <stop offset="100%" stop-color="#030712" />
        </linearGradient>
    </defs>

    <path d="M0 0 H400 C300 150 150 100 0 300 Z" fill="url(#blueTop)" />
</svg>

    <input type="file" accept="image/*" id="InputField" hidden>

    <script>
        const imgView = document.getElementById("imgView")
        const btn = document.getElementById("btn")
        const canvas = document.getElementById("canvas")

        var canvasIs = false

        const inputField = document.getElementById("InputField")
        const ctx = canvas.getContext("2d")

        const observer = new ResizeObserver(() => {
            btn.style.width = imgView.getBoundingClientRect().width + "px"
        })
        observer.observe(imgView)

        // Download Button click
        btn.addEventListener('click', () => {
            if (!canvasIs) return
            const link = document.createElement("a")
            const image = canvas.toDataURL("image/png")
            link.href = image
            link.download = "Negative.png"
            link.click()
        })
        // Main Container : click / proceed Data abstraction - computation - preparation of downloadable 
        imgView.addEventListener('click', () => {
            inputField.click()

        })
        inputField.addEventListener("change", (e) => {
            const file = e.target.files[0]
            if (!file) return;
            const img = new Image()
            img.onload = () => {
                canvas.width = img.width
                canvas.height = img.height

                ctx.drawImage(img, 0, 0)
                const image_data = ctx.getImageData(0, 0, canvas.width, canvas.height)
                const data = image_data.data

                for (let i = 0; i <= data.length; i += 4) {
                    data[i] = 255 - data[i]
                    data[i + 1] = 255 - data[i + 1]
                    data[i + 2] = 255 - data[i + 2]
                }
                ctx.putImageData(image_data, 0, 0)
                URL.revokeObjectURL(img.src)
            }
            img.src = URL.createObjectURL(file)
            canvasIs = true
        })
    </script>
</body>
